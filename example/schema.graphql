schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

"""
Whoever a task belongs to: a person or a team.
"""
interface Actor {
  """
  The name to show for this actor.
  """
  displayName: String!
  """
  A globally unique identifier, which node(id:) resolves back to this object.
  """
  id: ID!
}

"""
A 64-bit signed integer, serialised as a decimal string because a JSON number cannot carry the full range without loss of precision.
"""
scalar Int64

type Mutation {
  """
  Adds a task.
  """
  addTask(
    """
    The global id of the user or team it belongs to.
    """
    ownerId: ID!
    """
    What needs doing.
    """
    title: String!
  ): Task
  """
  Marks a task done, or not done.
  """
  setTaskDone(
    """
    The new state.
    """
    done: Boolean!
    """
    The task's global id.
    """
    id: ID!
  ): Task
}

"""
An object with a globally unique identifier, which a client can refetch with the node field.
"""
interface Node {
  """
  A globally unique identifier.
  """
  id: ID!
}

"""
Where a page sits in the whole list.
"""
type PageInfo {
  """
  The cursor of the last item in this page, or null if it is empty.
  """
  endCursor: String
  """
  Whether more items follow this page.
  """
  hasNextPage: Boolean!
  """
  Whether more items precede this page.
  """
  hasPreviousPage: Boolean!
  """
  The cursor of the first item in this page, or null if it is empty.
  """
  startCursor: String
}

type Query {
  """
  Looks up a single object by its global identifier.
  """
  node(
    """
    The object's global identifier.
    """
    id: ID!
  ): Node
  """
  Looks up several objects by their global identifiers, in the order given.
  """
  nodes(
    """
    The objects' global identifiers.
    """
    ids: [ID!]!
  ): [Node]!
  """
  Every task, oldest first.
  """
  tasks(
    """
    Return items after this cursor.
    """
    after: String
    """
    Return items before this cursor.
    """
    before: String
    """
    Return the first n items.
    """
    first: Int
    """
    Return the last n items.
    """
    last: Int
  ): TaskConnection!
  """
  The signed-in user. This example always signs in as Ada.
  """
  viewer: User
}

type Subscription {
  """
  Every task, pushed again whenever any of them changes.
  """
  tasks(
    """
    Return items after this cursor.
    """
    after: String
    """
    Return items before this cursor.
    """
    before: String
    """
    Return the first n items.
    """
    first: Int
    """
    Return the last n items.
    """
    last: Int
  ): TaskConnection!
}

"""
A unit of work.
"""
type Task implements Node {
  """
  When it was added.
  """
  added: Time!
  """
  Whether it has been done.
  """
  done: Boolean!
  """
  A globally unique identifier, which node(id:) resolves back to this object.
  """
  id: ID!
  """
  Whoever the task belongs to.
  """
  owner: Actor
  """
  How far along the task is.
  """
  status: TaskStatus!
  """
  What needs doing.
  """
  title: String!
}

"""
A paginated list of Task, following the Relay Cursor Connections specification.
"""
type TaskConnection {
  """
  The items in this page, each with its cursor.
  """
  edges: [TaskEdge!]!
  """
  Where this page sits in the whole list.
  """
  pageInfo: PageInfo!
  """
  How many items the whole list holds. An extension; Relay ignores it.
  """
  totalCount: Int64!
}

"""
An edge in a Task connection.
"""
type TaskEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!
  """
  The item at the end of the edge.
  """
  node: Task!
}

"""
How far along a task is.
"""
enum TaskStatus {
  DONE
  TODO
}

"""
A group of people.
"""
type Team implements Actor & Node {
  """
  The name to show for this actor.
  """
  displayName: String!
  """
  A globally unique identifier, which node(id:) resolves back to this object.
  """
  id: ID!
  """
  How many people are on it.
  """
  members: Int!
  """
  The team's display name.
  """
  name: String!
}

"""
An instant in time, serialised as an RFC 3339 timestamp.
"""
scalar Time

"""
A person.
"""
type User implements Actor & Node {
  """
  The name to show for this actor.
  """
  displayName: String!
  """
  Where to reach them.
  """
  email: String!
  """
  A globally unique identifier, which node(id:) resolves back to this object.
  """
  id: ID!
  """
  The user's display name.
  """
  name: String!
}

