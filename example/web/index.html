<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lightning example</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0 auto;
        max-width: 42rem;
        padding: 2rem 1rem;
        line-height: 1.5;
      }
      ul { padding-left: 1.2rem; }
      li { margin: 0.25rem 0; }
      label { display: inline-flex; gap: 0.5rem; align-items: center; }
      small { color: #666; }
      aside { border-top: 1px solid #ddd; margin-top: 2rem; padding-top: 1rem; }
      form { display: flex; gap: 0.5rem; margin-top: 1rem; }
      input[type="text"], input:not([type]) { flex: 1; padding: 0.4rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
